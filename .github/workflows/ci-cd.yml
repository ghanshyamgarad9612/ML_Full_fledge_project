name: ML EDA Full Fledge CI/CD

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


# ============================================================
# JOB
# ============================================================

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Checkout Repository
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ------------------------------------------------------
      # 3. Install Dependencies
      # ------------------------------------------------------

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff


      # ------------------------------------------------------
      # 4. Check Python Version
      # ------------------------------------------------------

      - name: Verify Python
        run: |
          python --version
          pip --version


      # ------------------------------------------------------
      # 5. Lint Code
      # ------------------------------------------------------

      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/


      # ------------------------------------------------------
      # 6. Run Tests
      # ------------------------------------------------------

      - name: Run Pytest
        run: |
          pytest tests/ -v


      # ------------------------------------------------------
      # 7. Verify Python Syntax
      # ------------------------------------------------------

      - name: Check Python Syntax
        run: |
          python -m compileall src tests


      # ------------------------------------------------------
      # 8. Verify Dataset Module
      # ------------------------------------------------------

      - name: Test Dataset Module
        run: |
          python -m src.dataset


      # ------------------------------------------------------
      # 9. Verify Feature Engineering
      # ------------------------------------------------------

      - name: Test Feature Engineering
        run: |
          python -m src.features


      # ------------------------------------------------------
      # 10. Verify Prediction Module
      # ------------------------------------------------------

      - name: Test Prediction Module
        run: |
          python -m src.predict


      # ------------------------------------------------------
      # 11. Verify Reports
      # ------------------------------------------------------

      - name: Generate Reports
        run: |
          python -m src.reports


      # ------------------------------------------------------
      # 12. Build Docker Image
      # ------------------------------------------------------

      - name: Build Docker Image
        run: |
          docker build -t nitins1/ml-eda-full-fledge:latest .


      # ------------------------------------------------------
      # 13. Docker Image Test
      # ------------------------------------------------------

      - name: Verify Docker Image
        run: |
          docker images